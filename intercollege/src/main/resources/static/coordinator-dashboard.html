<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Coordinator Dashboard - InterCollege</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/coordinator-dashboard.css">

</head>

<body>

<main class="coordinator-dashboard">

    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="dashboard-header">

        <div>

            <h1>
                Coordinator Dashboard
            </h1>

            <p id="coordinatorWelcome">
                Loading...
            </p>

        </div>

        <button
            id="logoutButton"
            class="logout-btn"
        >
            Logout
        </button>

    </header>


    <!-- =====================================
         CREATE EVENT
    ====================================== -->

    <section class="create-event-section">

        <div class="section-title">

            <h2>
                Add New Event
            </h2>

            <p>
                Create and publish an event for students.
            </p>

        </div>


        <form id="eventForm">

            <!-- BASIC INFORMATION -->

            <div class="form-section">

                <h3>
                    Event Information
                </h3>


                <div class="form-grid">

                    <!-- Event Name -->

                    <div class="form-group">

                        <label for="eventName">
                            Event Name
                        </label>

                        <input
                            type="text"
                            id="eventName"
                            placeholder="Enter event name"
                            required
                        >

                    </div>


                    <!-- College -->

                    <div class="form-group">

                        <label for="college">
                            College
                        </label>

                        <input
                            type="text"
                            id="college"
                            placeholder="Enter college name"
                            required
                        >

                    </div>


                    <!-- Category -->

                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <select
                            id="category"
                            required
                        >

                            <option value="">
                                Select category
                            </option>

                            <option value="Technical">
                                Technical
                            </option>

                            <option value="Cultural">
                                Cultural
                            </option>

                            <option value="Talk Session">
                                Talk Session
                            </option>

                            <option value="Treasure Hunt">
                                Treasure Hunt
                            </option>

                            <option value="Public Speaking">
                                Public Speaking
                            </option>

                            <option value="Quiz">
                                Quiz
                            </option>

                            <option value="Makeathon">
                                Makeathon
                            </option>

                            <option value="Workshop">
                                Workshop
                            </option>

                            <option value="Sports">
                                Sports
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- Date -->

                    <div class="form-group">

                        <label for="date">
                            Date
                        </label>

                        <input
                            type="date"
                            id="date"
                            required
                        >

                    </div>

                </div>


                <!-- Description -->

                <div class="form-group full-width">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="4"
                        placeholder="Describe the event..."
                        required
                    ></textarea>

                </div>

            </div>


            <!-- DATE & LOCATION -->

            <div class="form-section">

                <h3>
                    Date & Location
                </h3>


                <div class="form-grid">

                    <!-- Start Time -->

                    <div class="form-group">

                        <label for="startTime">
                            Start Time
                        </label>

                        <input
                            type="time"
                            id="startTime"
                            required
                        >

                    </div>


                    <!-- End Time -->

                    <div class="form-group">

                        <label for="endTime">
                            End Time
                        </label>

                        <input
                            type="time"
                            id="endTime"
                            required
                        >

                    </div>


                    <!-- Venue -->

                    <div class="form-group">

                        <label for="venue">
                            Venue
                        </label>

                        <input
                            type="text"
                            id="venue"
                            placeholder="Enter venue"
                            required
                        >

                    </div>


                    <!-- City -->

                    <div class="form-group">

                        <label for="city">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            placeholder="Enter city"
                            required
                        >

                    </div>


                    <!-- Latitude -->

                    <div class="form-group">

                        <label for="latitude">
                            Latitude
                        </label>

                        <input
                            type="number"
                            id="latitude"
                            step="any"
                            placeholder="e.g. 8.5241"
                        >

                    </div>


                    <!-- Longitude -->

                    <div class="form-group">

                        <label for="longitude">
                            Longitude
                        </label>

                        <input
                            type="number"
                            id="longitude"
                            step="any"
                            placeholder="e.g. 76.9366"
                        >

                    </div>

                </div>

            </div>


            <!-- REGISTRATION DETAILS -->

            <div class="form-section">

                <h3>
                    Registration Details
                </h3>


                <div class="form-grid">

                    <!-- Registration Link -->

                    <div class="form-group">

                        <label for="registrationLink">
                            Registration Link
                        </label>

                        <input
                            type="url"
                            id="registrationLink"
                            placeholder="https://..."
                        >

                    </div>


                    <!-- Organizer -->

                    <div class="form-group">

                        <label for="organizer">
                            Organizer
                        </label>

                        <input
                            type="text"
                            id="organizer"
                            placeholder="Organizer name"
                            required
                        >

                    </div>


                    <!-- Contact -->

                    <div class="form-group">

                        <label for="contact">
                            Contact
                        </label>

                        <input
                            type="text"
                            id="contact"
                            placeholder="Email or phone"
                            required
                        >

                    </div>


                    <!-- Maximum Participants -->

                    <div class="form-group">

                        <label for="maxParticipants">
                            Maximum Participants
                        </label>

                        <input
                            type="number"
                            id="maxParticipants"
                            min="1"
                            placeholder="Optional"
                        >

                    </div>

                </div>


                <!-- Image URL -->

                <div class="form-group full-width">

                    <label for="imageUrl">
                        Image URL
                    </label>

                    <input
                        type="url"
                        id="imageUrl"
                        placeholder="https://example.com/event-image.jpg"
                    >

                </div>

            </div>


            <!-- MESSAGE -->

            <p
                id="eventMessage"
                class="event-message"
            ></p>


            <!-- SUBMIT -->

            <div class="form-actions">

                <button
                    type="submit"
                    class="btn create-event-btn"
                >
                    Add Event
                </button>

            </div>

        </form>

    </section>


    <!-- =====================================
         AVAILABLE EVENTS
    ====================================== -->

    <section class="available-events-section">

        <div class="section-title">

            <h2>
                Available Events
            </h2>

            <p>
                Events currently available on InterCollege.
            </p>

        </div>


        <div id="eventsContainer"></div>


        <p
            id="noEventsMessage"
            class="no-events"
            style="display: none;"
        >
            No events available.
        </p>

    </section>

</main>


<script src="js/coordinator-dashboard.js"></script>

</body>

</html>
