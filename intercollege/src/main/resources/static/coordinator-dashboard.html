<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Coordinator Dashboard - InterCollege</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/coordinator-dashboard.css"
    >

</head>


<body>

<main class="coordinator-dashboard">


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="dashboard-header">

        <div>

            <h1>
                Coordinator Dashboard
            </h1>

            <p id="coordinatorWelcome">
                Loading...
            </p>

        </div>


        <div class="dashboard-actions">

            <a
                href="index.html"
                class="home-btn"
            >
                Home
            </a>

            <button
                id="logoutButton"
                class="logout-btn"
                type="button"
            >
                Logout
            </button>

        </div>

    </header>



    <!-- =====================================
         CREATE / EDIT EVENT
    ====================================== -->

    <section class="create-event-section">


        <div class="section-title">

            <h2 id="formTitle">
                Add New Event
            </h2>

            <p id="formSubtitle">
                Create and publish an event for students.
            </p>

        </div>



        <form id="eventForm">


            <!-- =================================
                 EVENT INFORMATION
            ================================== -->

            <div class="form-section">

                <h3>
                    Event Information
                </h3>


                <div class="form-grid">


                    <!-- EVENT NAME -->

                    <div class="form-group">

                        <label for="eventName">
                            Event Name
                        </label>

                        <input
                            type="text"
                            id="eventName"
                            placeholder="Enter event name"
                            required
                        >

                    </div>



                    <!-- COLLEGE -->

                    <div class="form-group">

                        <label for="college">
                            College
                        </label>

                        <input
                            type="text"
                            id="college"
                            placeholder="Enter college name"
                            required
                        >

                    </div>



                    <!-- CATEGORY -->

                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <select
                            id="category"
                            required
                        >

                            <option value="">
                                Select category
                            </option>

                            <option value="Technical">
                                Technical
                            </option>

                            <option value="Cultural">
                                Cultural
                            </option>

                            <option value="Talk Session">
                                Talk Session
                            </option>

                            <option value="Treasure Hunt">
                                Treasure Hunt
                            </option>

                            <option value="Public Speaking">
                                Public Speaking
                            </option>

                            <option value="Quiz">
                                Quiz
                            </option>

                            <option value="Makeathon">
                                Makeathon
                            </option>

                            <option value="Workshop">
                                Workshop
                            </option>

                            <option value="Sports">
                                Sports
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>



                    <!-- DATE -->

                    <div class="form-group">

                        <label for="date">
                            Date
                        </label>

                        <input
                            type="date"
                            id="date"
                            required
                        >

                    </div>

                </div>



                <!-- DESCRIPTION -->

                <div class="form-group full-width">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="4"
                        placeholder="Describe the event..."
                        required
                    ></textarea>

                </div>

            </div>



            <!-- =================================
                 DATE AND LOCATION
            ================================== -->

            <div class="form-section">

                <h3>
                    Date &amp; Location
                </h3>


                <div class="form-grid">


                    <!-- START TIME -->

                    <div class="form-group">

                        <label for="startTime">
                            Start Time
                        </label>

                        <input
                            type="time"
                            id="startTime"
                            required
                        >

                    </div>



                    <!-- END TIME -->

                    <div class="form-group">

                        <label for="endTime">
                            End Time
                        </label>

                        <input
                            type="time"
                            id="endTime"
                            required
                        >

                    </div>



                    <!-- VENUE -->

                    <div class="form-group">

                        <label for="venue">
                            Venue
                        </label>

                        <input
                            type="text"
                            id="venue"
                            placeholder="Enter venue"
                            required
                        >

                    </div>



                    <!-- CITY -->

                    <div class="form-group">

                        <label for="city">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            placeholder="Enter city"
                            required
                        >

                    </div>



                    <!-- LATITUDE -->

                    <div class="form-group">

                        <label for="latitude">
                            Latitude
                        </label>

                        <input
                            type="number"
                            id="latitude"
                            step="any"
                            placeholder="e.g. 8.5241"
                        >

                    </div>



                    <!-- LONGITUDE -->

                    <div class="form-group">

                        <label for="longitude">
                            Longitude
                        </label>

                        <input
                            type="number"
                            id="longitude"
                            step="any"
                            placeholder="e.g. 76.9366"
                        >

                    </div>

                </div>

            </div>



            <!-- =================================
                 REGISTRATION DETAILS
            ================================== -->

            <div class="form-section">

                <h3>
                    Registration Details
                </h3>


                <div class="form-grid">


                    <!-- REGISTRATION LINK -->

                    <div class="form-group">

                        <label for="registrationLink">
                            Registration Link
                        </label>

                        <input
                            type="url"
                            id="registrationLink"
                            placeholder="https://..."
                        >

                    </div>



                    <!-- ORGANIZER -->

                    <div class="form-group">

                        <label for="organizer">
                            Organizer
                        </label>

                        <input
                            type="text"
                            id="organizer"
                            placeholder="Organizer name"
                            required
                        >

                    </div>



                    <!-- CONTACT -->

                    <div class="form-group">

                        <label for="contact">
                            Contact
                        </label>

                        <input
                            type="text"
                            id="contact"
                            placeholder="Email or phone"
                            required
                        >

                    </div>



                    <!-- MAX PARTICIPANTS -->

                    <div class="form-group">

                        <label for="maxParticipants">
                            Maximum Participants
                        </label>

                        <input
                            type="number"
                            id="maxParticipants"
                            min="1"
                            placeholder="Optional"
                        >

                    </div>

                </div>



                <!-- IMAGE URL -->

                <div class="form-group full-width">

                    <label for="imageUrl">
                        Image URL
                    </label>

                    <input
                        type="url"
                        id="imageUrl"
                        placeholder="https://example.com/event-image.jpg"
                    >

                </div>

            </div>



            <!-- =================================
                 MESSAGE
            ================================== -->

            <p
                id="eventMessage"
                class="event-message"
            ></p>



            <!-- =================================
                 FORM BUTTONS
            ================================== -->

            <div class="form-actions">


                <button
                    type="submit"
                    id="submitEventButton"
                    class="btn create-event-btn"
                >
                    Add Event
                </button>


                <button
                    type="button"
                    id="cancelEditButton"
                    class="cancel-btn"
                    style="display: none;"
                >
                    Cancel Edit
                </button>

            </div>


        </form>

    </section>



    <!-- =====================================
         AVAILABLE EVENTS
    ====================================== -->

    <section class="available-events-section">


        <div class="section-title">

            <h2>
                Available Events
            </h2>

            <p>
                Events currently available on InterCollege.
            </p>

        </div>



        <div id="eventsContainer"></div>



        <p
            id="noEventsMessage"
            class="no-events"
            style="display: none;"
        >
            No events available.
        </p>


    </section>


</main>



<script src="js/coordinator-dashboard.js"></script>

</body>

</html>
