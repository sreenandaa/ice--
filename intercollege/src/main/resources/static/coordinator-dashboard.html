<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Coordinator Dashboard - InterCollege</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<main class="container">

    <h1>Coordinator Dashboard</h1>

    <p id="coordinatorWelcome">
        Loading...
    </p>


    <section class="card">

        <h2>Add New Event</h2>


        <form id="eventForm">

            <label>Event Name</label>

            <input
                type="text"
                id="eventName"
                required
            >


            <label>Description</label>

            <textarea
                id="description"
                required
            ></textarea>


            <label>College</label>

            <input
                type="text"
                id="college"
                required
            >


            <label>Category</label>

            <select
                id="category"
                required
            >

                <option value="">
                    Select category
                </option>

                <option value="Technical">
                    Technical
                </option>

                <option value="Cultural">
                    Cultural
                </option>

                <option value="Talk Session">
                    Talk Session
                </option>

                <option value="Treasure Hunt">
                    Treasure Hunt
                </option>

                <option value="Public Speaking">
                    Public Speaking
                </option>

                <option value="Quiz">
                    Quiz
                </option>

                <option value="Makeathon">
                    Makeathon
                </option>

                <option value="Workshop">
                    Workshop
                </option>

                <option value="Sports">
                    Sports
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label>Date</label>

            <input
                type="date"
                id="date"
                required
            >


            <label>Start Time</label>

            <input
                type="time"
                id="startTime"
                required
            >


            <label>End Time</label>

            <input
                type="time"
                id="endTime"
                required
            >


            <label>Venue</label>

            <input
                type="text"
                id="venue"
                required
            >


            <label>City</label>

            <input
                type="text"
                id="city"
                required
            >


            <label>Latitude</label>

            <input
                type="number"
                id="latitude"
                step="any"
            >


            <label>Longitude</label>

            <input
                type="number"
                id="longitude"
                step="any"
            >


            <label>Registration Link</label>

            <input
                type="url"
                id="registrationLink"
            >


            <label>Organizer</label>

            <input
                type="text"
                id="organizer"
                required
            >


            <label>Contact</label>

            <input
                type="text"
                id="contact"
                required
            >


            <label>Image URL</label>

            <input
                type="url"
                id="imageUrl"
            >


            <label>Maximum Participants</label>

            <input
                type="number"
                id="maxParticipants"
                min="1"
            >


            <button
                type="submit"
                class="btn"
            >
                Add Event
            </button>

        </form>


        <p id="eventMessage"></p>

    </section>


    <section>

        <h2>Available Events</h2>

        <div id="eventsContainer"></div>

    </section>

</main>


<script src="js/coordinator-dashboard.js"></script>

</body>

</html>
