<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile - InterCollege</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/profile.css">

</head>

<body>

<main class="container profile-page">

    <a
        href="student-dashboard.html"
        id="backToDashboard"
        class="back-link"
    >
        ← Back to Dashboard
    </a>


    <div class="profile-card card">

        <h1>My Profile</h1>

        <p
            id="profileMessage"
            class="profile-message"
        >
            Loading profile...
        </p>


        <div
            id="profileInfo"
            class="profile-info"
            style="display: none;"
        >

            <div class="profile-row">

                <strong>Name</strong>

                <span id="profileName">
                    -
                </span>

            </div>


            <div class="profile-row">

                <strong>Username</strong>

                <span id="profileUsername">
                    -
                </span>

            </div>


            <div class="profile-row">

                <strong>Role</strong>

                <span id="profileRole">
                    -
                </span>

            </div>


            <div class="profile-row">

                <strong>College</strong>

                <span id="profileCollege">
                    -
                </span>

            </div>


            <div class="profile-row">

                <strong>Location</strong>

                <span id="profileLocation">
                    -
                </span>

            </div>


            <div class="profile-row">

                <strong>Interests</strong>

                <span id="profileInterests">
                    -
                </span>

            </div>

        </div>

    </div>


    <button
        id="logoutButton"
        class="logout-btn"
        type="button"
    >
        Logout
    </button>

</main>


<script src="js/profile.js"></script>

</body>

</html>
