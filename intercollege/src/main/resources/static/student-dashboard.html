<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Dashboard - InterCollege</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/student-dashboard.css">

</head>

<body>

<main class="student-dashboard">

    <!-- HEADER -->

    <section class="dashboard-header">

        <div>
            <h1>Student Dashboard</h1>

            <p id="studentWelcome">
                Loading...
            </p>
        </div>

        <button
            id="logoutButton"
            class="logout-btn"
        >
            Logout
        </button>

    </section>


    <!-- SEARCH -->

    <section class="search-section">

        <h2>Find Events</h2>

        <input
            type="text"
            id="searchInput"
            placeholder="Search by event, category, college or location..."
        >

    </section>


    <!-- RECOMMENDED EVENTS -->

    <section class="events-section">

        <h2>Recommended Events</h2>

        <div id="eventsContainer"></div>

        <p
            id="noEventsMessage"
            class="no-events"
            style="display: none;"
        >
            No events found.
        </p>

    </section>

</main>


<script src="js/student-dashboard.js"></script>

</body>

</html>
